<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>取引の確認 — kicho-bot</title>
  <link rel="stylesheet" href="/review.css">
  <script src="/review.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">KICHO BOT / FREEE</p><h1>取引の確認</h1>
      <p>証憑と取引案を見比べて、出力する行を確定してください。</p>
      <p id="client"></p>
    </header>
    <nav><button id="refresh" type="button">再読込</button><button id="export" class="primary" type="button" disabled>確定した取引をCSV出力</button></nav>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="rows" aria-label="取引一覧"></section>
    <section><h2>出力履歴</h2><p>出力済みの行は次のCSVに含めません。再ダウンロードは同じファイルです。freeeへの取り込みは1回だけ行ってください。</p><div id="exports"></div></section>
  </main>
  <template id="row-template">
    <article>
      <div class="row-heading"><h2></h2><span class="badge"></span></div>
      <dl></dl>
      <ul class="reasons"></ul>
      <details><summary>証憑・内部仕訳・判定根拠</summary><h3>証憑テキスト</h3><pre class="source"></pre><h3>内部仕訳</h3><pre class="journal"></pre><h3>Jevの判定</h3><pre class="answers"></pre></details>
      <button class="confirm" type="button"></button>
    </article>
  </template>
</body>
</html>
